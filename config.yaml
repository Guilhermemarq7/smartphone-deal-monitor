budget:
  ideal: 3000
  soft_limit: 3200
  exceptional_limit: 3500

monitor:
  interval_minutes: 30

bootstrap:
  reference_file: data/bootstrap/radar_celulares_10-10_2026.md
  research_date: '2026-10-05'

database:
  path: data/radar.db
  retention_days: 120
  collector_run_retention_days: 30
  alert_event_retention_days: 30

output:
  dir: output

logging:
  file: logs/radar.log

analysis:
  outlier_ratio: 0.60
  max_plausible_price: 20000

discovery:
  enabled: true
  max_offer_price: 3500
  min_quality_score: 70
  target_price: 3200

condition:
  new_only: true

health:
  critical_min_targets: 2
  healthy_min_stores: 2
  healthy_min_coverage: 0.5
  operational_alerts: true
  alert_cooldown_hours: 24

alerts:
  min_score: 76
  alert_outliers: true
  repeat_after_hours: 24
  log_file: logs/opportunities.log
  telegram:
    enabled: true
  discord:
    enabled: false

sources:
  vtex:
    enabled: true
    cloud_enabled: true
    timeout_seconds: 12
    retries: 1
    min_delay_seconds: 1.5
    results_per_query: 50
    user_agent: 'SmartphoneDealMonitor/1.0'
    stores:
      - name: Fast Shop
        base_url: https://site.fastshop.com.br
        currency: BRL
        # Curated retail sellers observed in public catalog; reject other marketplace sellers.
        seller_ids: ['1', 'cnl222', 'cnl223'] # Fast Shop, Ponto, Casas Bahia
        new_products_only: true
        # Public category IDs verified in the retailer response; exclude accessories.
        filters: ['C:/18/113/']
        discovery_queries: ['Samsung Galaxy Ultra 256GB', 'iPhone 128GB']
      - name: Motorola
        base_url: https://www.motorola.com.br
        currency: BRL
        seller_ids: ['1']
        new_products_only: true
        manufacturer_official: true
        sku_query_param: idsku
        target_ids: ['edge_70_pro_256', 'edge_60_pro_512']
        discovery_queries: ['Motorola Edge Pro']
  mercadolivre:
    enabled: true
    cloud_enabled: true
    # API requires ML_ACCESS_TOKEN. A token alone does not guarantee search access.
    public_web_fallback: false
    timeout_seconds: 12
    retries: 2
    min_delay_seconds: 1.2
    results_per_query: 20
    user_agent: 'SmartphoneDealMonitor/1.0'
    discovery_queries:
      - 'Samsung Galaxy Ultra 256GB'
      - 'Samsung Galaxy S26 256GB'
      - 'Motorola Edge Pro 256GB'
      - 'Xiaomi 15T 256GB'
      - 'POCO F7 512GB'
      - 'iPhone 16 128GB'
  magalu:
    enabled: true
    # Public search HTML returned 403 on Actions; never bypass anti-bot protections.
    cloud_enabled: false
    timeout_seconds: 12
    retries: 2
    min_delay_seconds: 1.5
    user_agent: 'SmartphoneDealMonitor/1.0'
    discovery_queries:
      - 'Galaxy S Ultra 256GB'
      - 'Motorola Edge Pro 256GB'
      - 'Xiaomi 256GB'
      - 'iPhone 16 128GB'
  official_pages:
    enabled: true
    cloud_enabled: true
    timeout_seconds: 12
    retries: 2
    min_delay_seconds: 1.5
    user_agent: 'SmartphoneDealMonitor/1.0'
    pages:
      - target_id: galaxy_s25_256
        store: Samsung
        url: https://shop.samsung.com/br/galaxy-s25-256gb/p
      - target_id: galaxy_s26_256
        store: Samsung
        url: https://shop.samsung.com/br/galaxy-s26/p?skuId=13648
      - target_id: edge_70_pro_256
        store: Motorola
        url: https://www.motorola.com.br/smartphone-motorola-edge-70-pro-5g-256gb/p
      - target_id: edge_60_pro_512
        store: Motorola
        url: https://www.motorola.com.br/smartphone-motorola-edge-60-pro-5g-512gb/p?idsku=1779
  # Extension point for individually verified public product pages from other stores.
  # Use the verified VTEX integrations above; add HTML pages only after live validation.
  structured_pages:
    enabled: false
    cloud_enabled: false
    name: Páginas estruturadas adicionais
    timeout_seconds: 12
    retries: 2
    min_delay_seconds: 1.5
    pages: []

