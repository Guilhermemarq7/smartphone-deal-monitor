name: Radar de celulares

on:
  workflow_dispatch:
    inputs:
      send_test_telegram:
        description: "Enviar mensagem de teste do Telegram antes da coleta"
        required: false
        default: false
        type: boolean
  schedule:
    # Horário de São Paulo. Fora de outubro: a cada 30 min, nos minutos 07 e 37.
    - cron: '7,37 * * 1-9,11-12 *'
      timezone: 'America/Sao_Paulo'
    # Em outubro, exceto 10/10: a cada 30 min.
    - cron: '7,37 * 1-9,11-31 10 *'
      timezone: 'America/Sao_Paulo'
    # No dia 10/10: a cada 10 min.
    - cron: '*/10 * 10 10 *'
      timezone: 'America/Sao_Paulo'

permissions:
  contents: read

concurrency:
  group: smartphone-deal-radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      ML_ACCESS_TOKEN: ${{ secrets.ML_ACCESS_TOKEN }}
      PYTHONUNBUFFERED: '1'

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v7

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Restaurar histórico SQLite
        uses: actions/cache@v6
        with:
          path: data/radar.db
          key: radar-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            radar-state-

      - name: Instalar dependências
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Validar configuração cloud
        run: python tools/cloud_preflight.py

      - name: Testar Telegram (manual/opcional)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.send_test_telegram }}
        run: python tools/telegram_test.py

      - name: Executar radar
        run: python main.py

      - name: Mostrar relatório no resumo da execução
        if: always()
        shell: bash
        run: |
          if [ -f output/report.md ]; then
            cat output/report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Nenhum report.md foi gerado." >> "$GITHUB_STEP_SUMMARY"
          fi
